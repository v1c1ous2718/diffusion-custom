[project]
name = "diffusion-custom"
version = "0.1.0"
description = "Custom Diffusion (HW09) ablations: trainable params, steps, LR, guidance; CLIP/DINO fidelity vs editability"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "diffusers==0.33.1",
  "transformers==4.50.3",
  "accelerate",
  "safetensors",
  "huggingface-hub>=0.27,<0.30",
  "numpy",
  "pillow",
  "pandas",
  "matplotlib",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dc"]
